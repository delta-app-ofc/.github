name: "Local Delta Checks"
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  pr-checks:
    name: Governança da Pull Request
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      repository-projects: read
      contents: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validar commits
        env:
          GH_TOKEN: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          python ./scripts/validate_commits.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Validar .gitignore
        env:
          GH_TOKEN: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          python ./scripts/validate_gitignore.py
          --project ./.gitignore
          --reference ./.gitignore
          --repository .

      - name: Validar checks da PR
        env:
          GH_TOKEN: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ORG_NAME: ${{ github.repository_owner }}
        run: python ./scripts/route_checks.py

      - name: Adicionar revisores
        env:
          GH_TOKEN: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ORG_NAME: ${{ github.repository_owner }}
        run: python ./scripts/route_reviewers.py
