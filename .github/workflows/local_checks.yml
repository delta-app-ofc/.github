name: "Local Delta Checks"
on:
    pull_request:
        types: [opened, edited]

jobs:
    route-checks:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            repository-projects: read
            contents: read
        steps:
            - name: Checkout do código
              uses: actions/checkout@v4

            - name: Executar script de validação de checks
              env:
                GH_TOKEN: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
                PR_BODY: ${{ github.event.pull_request.body }}
                PR_URL: ${{ github.event.pull_request.html_url }}
                ORG_NAME: ${{ github.repository_owner }}
              run: python ./scripts/route_checks.py

            - name: Executar script de adição de revisores
              env:
                GH_TOKEN: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
                PR_BODY: ${{ github.event.pull_request.body }}
                PR_URL: ${{ github.event.pull_request.html_url }}
                ORG_NAME: ${{ github.repository_owner }}
              run: python ./scripts/route_reviewers.py