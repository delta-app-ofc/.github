name: Resultado do CI na Pull Request

on:
  workflow_call:
    inputs:
      needs_results:
        description: Resultado dos jobs técnicos que precedem este workflow.
        required: true
        type: string
    secrets:
      DELTA_ORG_AUTOMATION_TOKEN:
        required: true

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comentar resultado e atualizar checklist
        uses: actions/github-script@v7
        env:
          NEEDS_RESULTS: ${{ inputs.needs_results }}
        with:
          github-token: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
          script: |
            const prEvent = context.payload.pull_request;
            if (!prEvent) {
              core.info('Execução sem Pull Request; nada a reportar.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = prEvent.number;
            const warnings = [];
            const addWarning = message => {
              warnings.push(message);
              core.warning(message);
            };
            const writeSummary = async lines => {
              try {
                await core.summary.addRaw(lines.join('\n') + '\n').write();
              } catch (error) {
                core.warning('Não foi possível gravar o resumo do CI.');
              }
            };

            let results;
            try {
              results = JSON.parse(process.env.NEEDS_RESULTS);
              if (!results || typeof results !== 'object' || Array.isArray(results) ||
                  Object.values(results).some(job => !job || typeof job !== 'object' || !('result' in job))) {
                throw new Error('Resultados dos jobs em formato inválido');
              }
            } catch (error) {
              addWarning('Não foi possível interpretar os resultados dos jobs; nenhum marcador foi publicado.');
              await writeSummary([
                '## Resultado do CI',
                '',
                '- Resultado dos testes: **indisponível**; não houve aprovação.',
                '- Comentário e corpo/checklist: não atualizados.',
                '',
                '### Avisos',
                ...warnings.map(item => '- ' + item)
              ]);
              return;
            }
            const passed = Object.keys(results).length > 0 &&
              Object.values(results).every(job => job.result === 'success');

            let run;
            let pr;
            try {
              ({ data: run } = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: context.runId
              }));
              ({ data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: number
              }));
            } catch (error) {
              addWarning('Não foi possível conferir a execução e a PR; o comentário e o corpo não foram alterados.');
              await writeSummary([
                '## Resultado do CI',
                '',
                '- Testes obrigatórios: **' + (passed ? 'aprovados' : 'reprovados') + '**, conforme os resultados dos jobs necessários.',
                '- SHA atual da PR não confirmado; nenhum marcador foi publicado.',
                '- Comentário e corpo/checklist: não atualizados.',
                '',
                '### Avisos',
                ...warnings.map(item => '- ' + item)
              ]);
              return;
            }

            if (pr.head.sha !== prEvent.head.sha) {
              core.info('Execução antiga; comentário e checklist não foram alterados.');
              await writeSummary([
                '## Resultado do CI',
                '',
                '- Testes obrigatórios: **' + (passed ? 'aprovados' : 'reprovados') + '**, para um SHA obsoleto.',
                '- Comentário e corpo/checklist: não atualizados.'
              ]);
              return;
            }
            const testedSha = prEvent.head.sha;

            let jobs = [];
            let jobsAvailable = true;
            try {
              const response = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: context.runId, per_page: 100
              });
              if (!response.data || !Array.isArray(response.data.jobs)) {
                throw new Error('Lista de jobs em formato inválido');
              }
              jobs = response.data.jobs;
            } catch (error) {
              jobsAvailable = false;
              addWarning('Não foi possível carregar os detalhes dos jobs; o resultado continua baseado nos jobs necessários.');
            }
            const isReporterJob = job =>
              /report-ci|reportar resultado do ci/i.test(job.name);
            const technicalJobs = jobs.filter(job => !isReporterJob(job));
            const jobLines = technicalJobs
              .filter(job => job.conclusion !== 'skipped')
              .map(job => '- ' + (job.conclusion === 'success' ? '✅' : '❌') +
                ' ' + job.name + ': ' + (job.conclusion || job.status));
            const failedJobs = technicalJobs.filter(job =>
              job.conclusion && !['success', 'skipped'].includes(job.conclusion)
            );
            const failureLines = failedJobs.flatMap(job => {
              const failedSteps = (job.steps || []).filter(step =>
                step.conclusion && !['success', 'skipped'].includes(step.conclusion)
              );
              return failedSteps.length
                ? failedSteps.map(step => '- ' + job.name + ' / ' + step.name + ': ' + step.conclusion)
                : ['- Job ' + job.name + ': ' + job.conclusion];
            });

            const marker = '<!-- delta-ci-report -->';
            const body = marker + '\n## CI ' + (passed ? 'aprovado ✅' : 'reprovado ❌') +
              '\n\nWorkflow: **' + context.workflow + '** · execução #' + run.run_number +
              '\nCommit testado: `' + testedSha.slice(0, 7) + '`' +
              '\n\n' + (jobsAvailable
                ? (jobLines.length ? jobLines.join('\n') : 'Nenhum job de teste foi concluído.')
                : 'Detalhes dos jobs não puderam ser consultados.') +
              '\n\n' + (passed
                ? 'Os testes passaram para o commit atual da PR.'
                : 'Falhas:\n' + (failureLines.length ? failureLines.join('\n') :
                  '- Um ou mais jobs necessários não terminaram com sucesso.')) +
              '\n\n[Ver logs desta execução](' + run.html_url + ')';

            let commentPublished = true;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100
              });
              const previous = comments.find(comment =>
                comment.body && comment.body.includes(marker)
              );
              if (previous) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: previous.id, body
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: number, body
                });
              }
            } catch (error) {
              commentPublished = false;
              addWarning('Não foi possível publicar o comentário do CI.');
            }

            let bodyPublished = true;
            try {
              const markerPrefix = '<!-- delta-ci-result:';
              const resultMarker = markerPrefix + prEvent.head.sha + ':' +
                (passed ? 'success' : 'failure') + ' -->';
              let updatedBody = pr.body
                .replace(/<!-- delta-ci-result:[^>]*-->/g, '')
                .replace(/\s+$/, '') + '\n\n' + resultMarker;
              const checkbox = /^- \[[ xX]\] (O código foi devidamente testado e não causa novos bugs\.)([^\r\n]*)$/m;
              if (checkbox.test(updatedBody)) {
                const replacement = '- [' + (passed ? 'x' : ' ') +
                  '] $1$2';
                updatedBody = updatedBody.replace(checkbox, replacement);
              } else {
                core.warning('O checkbox de testes esperado não foi encontrado na descrição da PR.');
              }
              if (updatedBody !== pr.body) {
                await github.rest.pulls.update({
                  owner, repo, pull_number: number, body: updatedBody
                });
              }
            } catch (error) {
              bodyPublished = false;
              addWarning('Não foi possível atualizar o resultado/checkbox no corpo da PR.');
            }

            await writeSummary([
              '## Resultado do CI',
              '',
              '- Testes obrigatórios: **' + (passed ? 'aprovados' : 'reprovados') + '**.',
              '- Commit testado: `' + testedSha.slice(0, 7) + '`.',
              '- Comentário do CI: ' + (commentPublished ? 'publicado/atualizado' : 'não publicado') + '.',
              '- Corpo/checklist da PR: ' + (bodyPublished ? 'atualizado' : 'não atualizado') + '.',
              warnings.length ? '\n### Avisos\n\n' + warnings.map(item => '- ' + item).join('\n') : '',
              '',
              passed
                ? 'As falhas de publicação são informativas; o check de testes permanece a fonte de aprovação.'
                : 'A publicação de relatórios não altera a reprovação dos testes obrigatórios.'
            ].filter(Boolean));
