name: "Delta Checks Routing"

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: true

jobs:
  code-quality:
    name: Qualidade e sintaxe do código
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      packages: read
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verificar código e sintaxe
        uses: super-linter/super-linter/slim@v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          MULTI_STATUS: false

          # Segurança e integridade
          VALIDATE_GITLEAKS: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true

          # GitHub e arquivos de configuração
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_XML: true

          # Python
          VALIDATE_PYTHON_RUFF: true

          # Java
          VALIDATE_JAVA: true

          # JavaScript e TypeScript
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true

          # Web
          VALIDATE_HTML: true
          VALIDATE_CSS: true

          # Banco de dados
          VALIDATE_SQL: true

          FAIL_ON_INVALID_GITHUB_ACTIONS_EVENT_CONFIGURATION: true
          SUPPRESS_OUTPUT_ON_SUCCESS: true

  pr-checks:
    name: Governança da Pull Request
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      repository-projects: read
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout dos scripts globais (.github)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/.github
          path: actions-scripts
          persist-credentials: false

      - name: Validar commits
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          python ./actions-scripts/scripts/validate_commits.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Validar .gitignore
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          python ./actions-scripts/scripts/validate_gitignore.py
          --project ./.gitignore
          --reference ./actions-scripts/.gitignore
          --repository .

      - name: Validar checks da PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ORG_NAME: ${{ github.repository_owner }}
        run: python ./actions-scripts/scripts/route_checks.py

      - name: Adicionar revisores
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ORG_NAME: ${{ github.repository_owner }}
        run: python ./actions-scripts/scripts/route_reviewers.py
