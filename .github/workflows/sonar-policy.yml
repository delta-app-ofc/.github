name: Avaliar política Sonar

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: ['Validação Sonar', 'Reavaliar aprovações Sonar']
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-policy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  policy:
    uses: delta-app-ofc/.github/.github/workflows/sonar_policy.yml@cb23646ff67b82ee47a73f4c94babef59c1dd20d
    with:
      project_key: ${{ vars.SONAR_PROJECT_KEY || 'delta-app-ofc_.github' }}
      pr_number: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}
    secrets:
      SONAR_POLICY_TOKEN: ${{ secrets.SONAR_POLICY_TOKEN }}
      DELTA_ORG_AUTOMATION_TOKEN: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
