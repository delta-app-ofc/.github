name: Testes técnicos

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: technical-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verificar sintaxe Python
        run: python -m compileall -q scripts tests
      - name: Executar testes unitários
        run: python -m unittest discover -s tests -v
